<!-- ════════════════════════════════════════════════════
  Member Table Template (Async version with Loading UI)
  ════════════════════════════════════════════════════ -->

<div class="table-container">

  <!-- ── Header ── -->
  <div class="page-header">
    <button class="btn btn-primary" (click)="openAddModal()" [disabled]="isLoading">
      Add Member
    </button>
  </div>

  <!-- ── Member Table ── -->
  <table class="member-table">
    <thead>
      <tr>
        <th>No.</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Salary</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>

      <!-- ── Loading Spinner Row ── -->
      <tr *ngIf="isLoading">
        <td colspan="7" class="loading-row">
          <div class="loading-spinner-container">
            <div class="loading-spinner"></div>
            <span class="loading-text">Fetching data from API...</span>
          </div>
        </td>
      </tr>

      <!-- ── Member Rows ── -->
      <ng-container *ngIf="!isLoading">
        <tr *ngFor="let member of members; let i = index">
          <td>{{ i + 1 }}</td>
          <td class="name-cell">{{ member.firstName }}</td>
          <td class="name-cell">{{ member.lastName }}</td>
          <td class="email-cell">{{ member.email }}</td>
          <td>${{ member.salary | number }}</td>
          <td [class.highlight-date]="true">{{ member.date }}</td>

          <td class="actions-cell">
            <button class="btn btn-edit" (click)="openEditModal(member)" [disabled]="isLoading">
              Edit
            </button>
            <button class="btn btn-delete" (click)="onDelete(member)" [disabled]="isLoading">
              Delete
            </button>
          </td>
        </tr>
      </ng-container>

      <!-- Empty state: shown when no members exist AND loading has finished -->
      <tr *ngIf="members.length === 0 && !isLoading">
        <td colspan="7" class="empty-row">
          No members found. Click "Add Member" to add one.
        </td>
      </tr>
    </tbody>
  </table>

</div>

<!-- ── Child Component: Member Form Modal ── -->
<app-member-form
  *ngIf="showModal"
  [memberToEdit]="memberToEdit"
  (save)="onSave($event)"
  (cancel)="closeModal()"
>
</app-member-form>
